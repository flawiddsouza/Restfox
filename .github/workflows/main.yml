name: Publish Electron Binaries

on:
  workflow_dispatch:
    inputs:
      job-to-run:
        description: 'Job to run (leave empty to run all)'
        required: false
        default: ''
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  NODE_VERSION: 26
  # Electron Forge unpacks Electron with extract-zip, which stops halfway on Node 26 and exits 0, so the Electron jobs
  # would pass with nothing built (nodejs/node#63487). Node only runs the build tools there, the app runs on Electron's.
  ELECTRON_BUILD_NODE_VERSION: 24

jobs:
  build-electron-linux:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.job-to-run == 'build-electron-linux' || github.event.inputs.job-to-run == 'build-electron-snap' || github.event.inputs.job-to-run == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.ELECTRON_BUILD_NODE_VERSION }}
      - name: Build UI
        working-directory: ./packages/ui
        run: |
          npm ci
          npm run build-desktop-electron
      # - name: Install flatpak dependencies
      #   run: |
      #     sudo apt-get install -y flatpak-builder
      #     flatpak --user remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Build deb, rpm, flatpak
        working-directory: ./packages/electron
        run: |
          npm ci
          export DEBUG=@malept/flatpak-bundler # required to see flatpak build logs
          npm run publish
  build-electron-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.job-to-run == 'build-electron-windows' || github.event.inputs.job-to-run == '' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.ELECTRON_BUILD_NODE_VERSION }}
      - name: Build UI
        working-directory: ./packages/ui
        run: |
          npm ci
          npm run build-desktop-electron
      - name: Build windows installer
        working-directory: ./packages/electron
        run: |
          npm ci
          npm run publish
  build-electron-mac:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.job-to-run == 'build-electron-mac' || github.event.inputs.job-to-run == '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # macos-26 is arm64, macos-26-intel is x86_64 (so we get builds for both architectures)
        # see https://github.com/actions/runner-images#available-images for more info
        os: [macos-26, macos-26-intel]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.ELECTRON_BUILD_NODE_VERSION }}
      - name: Build UI
        working-directory: ./packages/ui
        run: |
          npm ci
          npm run build-desktop-electron
      - name: Add macOS certs
        run: chmod +x scripts/add-osx-cert.sh && ./scripts/add-osx-cert.sh
        env:
          CERTIFICATE_OSX_APPLICATION: ${{ secrets.CERTIFICATE_OSX_APPLICATION }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
      - name: Build macos binaries
        working-directory: ./packages/electron
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          npm ci
          npm run publish
  build-electron-snap:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.job-to-run == 'build-electron-snap' || github.event.inputs.job-to-run == '' }}
    needs: [build-electron-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.ELECTRON_BUILD_NODE_VERSION }}
      - name: Build UI
        working-directory: ./packages/ui
        run: |
          npm ci
          npm run build-desktop-electron
      - name: Build snap package
        working-directory: ./packages/electron
        run: |
          npm ci
          npm run build-snap
      - name: Install Snapcraft
        run: |
          sudo apt-get install snapd
          sudo snap install snapcraft --classic
      - name: Set up Snap Store credentials & publish snap package
        run: |
          echo "${{ secrets.SNAP_STORE_TOKEN }}" | base64 -d > credentials.snapcraft
          export SNAPCRAFT_STORE_CREDENTIALS=$(cat credentials.snapcraft)
          snapcraft upload --release=candidate ./packages/electron/dist/*.snap
      - name: Set asset name
        run: echo "SNAP_FILE_NAME=$(basename $(ls ./packages/electron/dist/*.snap))" >> $GITHUB_ENV
      - name: Upload snap to GitHub release
        run: |
          node scripts/upload-file-to-latest-draft-release.js ./packages/electron/dist/${{ env.SNAP_FILE_NAME }}
  publish-chrome-extension:
    # Google admits the store sign-in only for a v tag, so a manual run on a branch skips this job
    if: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'workflow_dispatch' || github.event.inputs.job-to-run == 'publish-chrome-extension' || github.event.inputs.job-to-run == '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build UI
        working-directory: ./packages/ui
        run: |
          npm ci
          npm run build-desktop
      - name: Zip the extension app
        working-directory: ./packages/browser-extension/v3-app
        run: npm run zip
      - name: Keep the zip with the run
        uses: actions/upload-artifact@v7
        with:
          name: restfox-extension-app
          path: packages/browser-extension/v3-app/src.zip
      # Google only lets main.yml sign in for a v tag of this repository, see AGENTS.md
      - name: Sign in to Google as the store service account
        id: google
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/564579398954/locations/global/workloadIdentityPools/github/providers/restfox-repo
          service_account: restfox-release@chrome-web-store-api-access.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          create_credentials_file: false
      # Uploads as a draft, publishing stays a manual Submit for review in the store dashboard
      - name: Upload to the Chrome Web Store
        env:
          TOKEN: ${{ steps.google.outputs.access_token }}
          ITEM_URL: https://chromewebstore.googleapis.com/v2/publishers/c9838cf7-7295-4639-8a19-3ebf3ff634dd/items/fihmegnabgglklkppphibngblkomlhcn
          UPLOAD_URL: https://chromewebstore.googleapis.com/upload/v2/publishers/c9838cf7-7295-4639-8a19-3ebf3ff634dd/items/fihmegnabgglklkppphibngblkomlhcn
        run: |
          response=$(curl --fail-with-body -sS -X POST -H "Authorization: Bearer $TOKEN" -T packages/browser-extension/v3-app/src.zip "$UPLOAD_URL:upload")
          echo "$response"
          state=$(echo "$response" | jq -r '.uploadState')
          for attempt in $(seq 1 30); do
            [ "$state" != "IN_PROGRESS" ] && break
            sleep 10
            response=$(curl --fail-with-body -sS -H "Authorization: Bearer $TOKEN" "$ITEM_URL:fetchStatus")
            echo "$response"
            state=$(echo "$response" | jq -r '.lastAsyncUploadState')
          done
          [ "$state" = "SUCCEEDED" ] || { echo "Upload did not succeed: $state"; exit 1; }
  build-docker-image:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.job-to-run == 'build-docker-image' || github.event.inputs.job-to-run == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
      - name: Build and tag docker image
        working-directory: .
        run: |
          docker build -t flawiddsouza/restfox:${{ env.VERSION }} -t flawiddsouza/restfox:latest .
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish docker image
        run: |
          docker push --all-tags flawiddsouza/restfox
  update-release-notes:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.job-to-run == '' }}
    needs: [build-electron-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Generate & Update Release Notes
        run: |
          node scripts/update-release-notes.js
