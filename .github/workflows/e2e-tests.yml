name: E2E Tests with CodeceptJS

on:
  push:
    branches: ["main"]
    paths:
      - packages/ui/src/**
      - packages/ui/tests/**
  pull_request:
    branches:
      - '**'
    paths:
      - packages/ui/src/**
      - packages/ui/tests/**
      - packages/ui/package.json

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      # keep in step with the playwright version pinned in packages/ui/tests/package.json so the browsers are already
      # in the image and `npx playwright install` has nothing to download
      image: mcr.microsoft.com/playwright:v1.44.0-jammy
    defaults:
      run:
        working-directory: ./packages/ui
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 26
    - name: Install dependencies
      run: npm i
    - name: Run Playwright tests
      run: npm run ci-test
      env:
        HOME: /root
        # the default host answers with a redirect that the downloader stalls on, only reached if the image and the pinned version drift apart
        PLAYWRIGHT_DOWNLOAD_HOST: https://cdn.playwright.dev
